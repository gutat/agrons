name: Deploy to Rumah Web

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npm run generate
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          NUXT_PUBLIC_ADMIN_PATH: ${{ secrets.NUXT_PUBLIC_ADMIN_PATH }}
          NUXT_PUBLIC_APP_URL: ${{ secrets.NUXT_PUBLIC_APP_URL }}

      - name: Deploy static site
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: .output/public/
          server-dir: /public_html/
          exclude: |
            **/uploads/**

      # Write the PHP API config with real keys (never committed to git).
      # Uses quoted heredoc so the shell doesn't touch the PHP $vars.
      - name: Write PHP API config
        run: |
          cat > api/config.php <<'EOF'
          <?php
          return [
              'uploadApiKey' => '${{ secrets.UPLOAD_API_KEY }}',
              'signingKey' => '${{ secrets.UPLOAD_SIGNING_KEY }}',
          ];
          EOF

      - name: Deploy PHP API
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: api/
          server-dir: /public_html/api/
          exclude: |
            **/test-local.ps1
            **/uploads.htaccess
